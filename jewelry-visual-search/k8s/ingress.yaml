apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jewelry-search-ingress
  namespace: jewelry-search
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"  # Allow large image uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Requires cert-manager
spec:
  tls:
    - hosts:
        - api.jewelry-search.example.com
      secretName: jewelry-search-tls
  rules:
    - host: api.jewelry-search.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jewelry-search-service
                port:
                  number: 80
