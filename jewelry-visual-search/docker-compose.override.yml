# Development overrides - automatically loaded by docker-compose
# Use for local debugging, hot reload, volume mounts

version: "3.8"

services:
  api:
    volumes:
      # Hot reload for development
      - ./app:/app/app:ro
      # Mount local model cache to avoid re-download
      - ./model_cache:/app/model_cache
    environment:
      - DEBUG=true
      - DEVICE=cpu  # Use CPU for local dev (no GPU required)
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
